services:
  icinga2:
    image: jordan/icinga2:latest
    container_name: icinga-lab
    hostname: icinga-master
    ports:
      - "80:80"       # HTTP (Web Interface)
      - "443:443"     # HTTPS
      - "5665:5665"   # Icinga API (Important for your Agent)
      - "3306:3306"   # MySQL Database (For historical queries)
    environment:
      - ICINGAWEB2_ADMIN_USER=admin
      - ICINGAWEB2_ADMIN_PASS=${ICINGAWEB2_ADMIN_PASSWORD:-admin123}
      - ICINGA2_IDO_MYSQL_USER=icinga2
      - ICINGA2_IDO_MYSQL_PASS=${ICINGA_DB_PASSWORD:-change-me-lab-db}
      - ICINGAWEB2_MYSQL_USER=icingaweb2
      - ICINGAWEB2_MYSQL_PASS=${ICINGA_DB_PASSWORD:-change-me-lab-db}
      - ICINGAWEB2_DIRECTOR_MYSQL_USER=director
      - ICINGAWEB2_DIRECTOR_MYSQL_PASS=${ICINGA_DB_PASSWORD:-change-me-lab-db}
      - ICINGA2_FEATURE_DIRECTOR_PASS=${ICINGA_DB_PASSWORD:-change-me-lab-db}
    volumes:
      - icinga-data:/var/lib/icinga2
      - icinga-mysql:/var/lib/mysql
      - icinga-web:/etc/icingaweb2
      - ./icinga-module-ai:/usr/share/icingaweb2/modules/ai
    networks:
      - icinga-net
    depends_on:
      - opensearch

  ai-backend:
    build: 
      context: .
      dockerfile: Dockerfile.api
    container_name: ai-backend
    environment:
      - ICINGA_API_URL=https://icinga-lab:5665/v1
      - ICINGA_API_PASSWORD=${ICINGA_API_PASSWORD}
      - DIRECTOR_URL=http://icinga-lab/icingaweb2/director
      - DIRECTOR_API_URL=http://icinga-lab/icingaweb2/director
      - ES_HOST=opensearch-lab
      - DB_HOST=icinga-lab
      - DB_PASS=${ICINGA_DB_PASSWORD:-change-me-lab-db}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    ports:
      - "8000:8000"
    networks:
      - icinga-net
    volumes:
      - .:/app  # Live reload during development

  # Isolated OpenSearch sandbox — for local testing ONLY.
  # Icinga writes all its metrics/events here, and the AI Agent reads from here.
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-lab
    hostname: opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true   # No auth needed for local testing
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"   # OpenSearch REST API (Agent reads from here)
      - "9600:9600"   # OpenSearch performance analyzer
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - icinga-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboards-lab
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - icinga-net
    depends_on:
      - opensearch

networks:
  icinga-net:
    driver: bridge

volumes:
  icinga-data:
  icinga-mysql:
  icinga-web:
  opensearch-data:
